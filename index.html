<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Society：由 OpenAI Agents SDK 驱动的多智能体社会模拟。每一个参与者都有自己的记忆、情绪、信念与策略，在谈判、联盟、背叛与欺骗中实时交锋。" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Society — Live Multi-Agent Social Worlds</title>
    <style>
      #root:empty {
        display: grid;
        min-height: 100vh;
        place-items: center;
        background: #0a0a0a;
      }
      #root:empty::before {
        content: "";
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 2px solid rgba(255,255,255,0.1);
        border-top-color: #fafafa;
        animation: society-boot-spin 0.8s linear infinite;
      }
      @keyframes society-boot-spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        #root:empty::before { animation-duration: 2s; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
