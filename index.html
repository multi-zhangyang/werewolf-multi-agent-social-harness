<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Society：人物、经历与自主互动。" />
    <meta name="theme-color" content="#111111" />
    <script>
      try {
        const theme = localStorage.getItem("society:theme") || "dark";
        document.documentElement.classList.toggle("dark", theme === "dark" || theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
      } catch { document.documentElement.classList.add("dark"); }
    </script>
    <title>Society · 人物与互动</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
