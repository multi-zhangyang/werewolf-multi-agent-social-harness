<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Society：观察由真实模型驱动的多 Agent 社会互动。" />
    <meta name="theme-color" content="#0b0c10" />
    <title>Society · Multi-agent social worlds</title>
    <style>
      #root:empty {
        display: grid;
        min-height: 100vh;
        place-items: center;
        background: #f2f5fa;
      }
      #root:empty::before {
        content: "";
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 3px solid #dbe3f5;
        border-top-color: #3558d6;
        animation: society-boot-spin 0.8s linear infinite;
      }
      @keyframes society-boot-spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        #root:empty::before { animation-duration: 2s; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
